<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pauly’Bet — Logo en reconstruction</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Bricolage+Grotesque:wght@500;700&display=swap');
:root{color-scheme:dark;--green:#5CFF2E;--red:#ff4545}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#050605;color:#f5f5f5;font-family:'Bricolage Grotesque',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
main{width:min(100%,900px);padding:28px 20px 24px;text-align:center}
.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#8d958b;margin-bottom:18px}
h1{font-family:Unbounded,sans-serif;font-size:clamp(24px,5vw,48px);line-height:1.1;letter-spacing:-.06em;margin:0 0 10px;font-weight:900}
.sub{color:#92978f;font-size:14px;margin:0 auto 16px}
#stage{position:relative;width:min(76vw,460px);aspect-ratio:1;margin:0 auto 12px}
canvas{width:100%;height:100%;display:block}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
button{font:700 12px 'Bricolage Grotesque',sans-serif;letter-spacing:.04em;padding:12px 17px;border:1px solid #3b4238;border-radius:3px;background:#10130f;color:#f4f5f2;cursor:pointer}
button.primary{background:var(--green);border-color:var(--green);color:#071006}
button:hover{filter:brightness(1.1)}
.note{font-size:11px;color:#626a60;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="kicker">Pauly’Bet · Logo motion study</div>
<h1 id="headline">Tout se disperse.<br>Tout se rassemble.</h1>
<p class="sub" id="sub">Les pixels du logo original s’éparpillent puis reviennent à leur place.</p>
<div id="stage"><canvas id="scene" aria-label="Animation du logo Pauly’Bet"></canvas></div>
<div class="controls">
<button class="primary" id="replay">Rejouer l’animation</button>
<button id="scatter">Disperser</button>
<button id="assemble">Reformer le logo</button>
</div>
<div class="note">Prototype indépendant · le site principal n’est pas modifié</div>
</main>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{willReadFrequently:true);
const img=new Image();img.src='./icon.png';
let W=700,H=700,particles=[],raf=0,mode='assembled',start=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);const rect=canvas.getBoundingClientRect();W=Math.max(1,Math.round(rect.width*dpr));H=Math.max(1,Math.round(rect.height*dpr));canvas.width=W;canvas.height=H;if(img.complete&&img.naturalWidth)build();drawStatic();}
function build(){
 const off=document.createElement('canvas'),size=360;off.width=size;off.height=size;
 const o=off.getContext('2d',{willReadFrequently:true});o.clearRect(0,0,size,size);o.drawImage(img,0,0,size,size);
 const data=o.getImageData(0,0,size,size).data;particles=[];
 // Sampling the actual PNG preserves the real silhouette, colors and orbit rather than redrawing the mark.
 const step=3;
 for(let y=0;y<size;y+=step)for(let x=0;x<size;x+=step){
  const i=(y*size+x)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
  if(a>80 && (r>65||g>65||b>65)){
   const green=g>r*1.35&&g>b*1.2;
   const tx=(x/size)*W,ty=(y/size)*H;
   particles.push({x:tx,y:ty,tx,ty,vx:0,vy:0,delay:Math.random()*420,color:'rgb('+r+','+g+','+b+')',green,phase:Math.random()*Math.PI*2,size:step*(W/size)*(.7+Math.random()*.45)});
  }
 }
}
function drawStatic(){if(!particles.length)return;ctx.clearRect(0,0,W,H);for(const p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.tx,p.ty,p.size,p.size)}}
function scatter(){cancelAnimationFrame(raf);mode='scatter';start=performance.now();const cx=W/2,cy=H/2;for(const p of particles){const angle=Math.random()*Math.PI*2,dist=(.18+Math.random()*.75)*Math.min(W,H);p.x=p.tx;p.y=p.ty;p.sx=p.tx;p.sy=p.ty;p.ex=Math.max(-W*.1,Math.min(W*1.1,cx+Math.cos(angle)*dist));p.ey=Math.max(-H*.1,Math.min(H*1.1,cy+Math.sin(angle)*dist));p.delay=Math.random()*650;p.spin=(Math.random()-.5)*Math.PI*5;}raf=requestAnimationFrame(tick)}
function assemble(){cancelAnimationFrame(raf);mode='assemble';start=performance.now();for(const p of particles){p.sx=p.x;p.sy=p.y;p.delay=Math.random()*420;}raf=requestAnimationFrame(tick)}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function tick(now){const elapsed=now-start;ctx.clearRect(0,0,W,H);
 let allDone=true;
 for(const p of particles){
  let t=Math.max(0,Math.min(1,(elapsed-p.delay)/(mode==='scatter'?1250:1050)));
  if(t<1)allDone=false;
  const e=ease(t);
  if(mode==='scatter'){p.x=p.sx+(p.ex-p.sx)*e;p.y=p.sy+(p.ey-p.sy)*e;}
  else {p.x=p.sx+(p.tx-p.sx)*e;p.y=p.sy+(p.ty-p.sy)*e;}
  const wobble=t<1?Math.sin(t*Math.PI*5+p.phase)*(1-t)*7:0;
  ctx.globalAlpha=mode==='scatter'?.98:1;
  ctx.fillStyle=p.color;const s=p.size*(mode==='scatter'?1+Math.sin(t*Math.PI)*.35:1);
  ctx.save();ctx.translate(p.x+wobble,p.y-wobble);ctx.rotate(mode==='scatter'?p.spin*e*(1-t):0);ctx.fillRect(-s/2,-s/2,s,s);ctx.restore();
 }
 ctx.globalAlpha=1;
 if(allDone){if(mode==='scatter'){setTimeout(()=>{if(mode==='scatter')assemble()},500);return;}mode='assembled';return}
 raf=requestAnimationFrame(tick)
}
function replay(){cancelAnimationFrame(raf);if(!particles.length)return;for(const p of particles){p.x=p.tx;p.y=p.ty;}drawStatic();setTimeout(scatter,500)}
img.onload=()=>{resize();setTimeout(replay,450)};img.onerror=()=>{document.querySelector('#sub').textContent='Impossible de charger icon.png. Vérifie que le fichier est dans le même dossier.'};
window.addEventListener('resize',resize);
document.querySelector('#replay').addEventListener('click',replay);
document.querySelector('#scatter').addEventListener('click',scatter);
document.querySelector('#assemble').addEventListener('click',assemble);
</script>
</body>
</html>
