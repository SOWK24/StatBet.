name: Generate iPhone 17 PWA startup image

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "icon.png"
      - ".github/workflows/generate-iphone17-startup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate exact-size PNG from the existing app icon
        run: |
          npm install --no-save sharp
          node <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const logo = await sharp('icon.png')
              .trim({ background: '#000000', threshold: 8 })
              .resize({ width: 760, height: 760, fit: 'inside' })
              .png()
              .toBuffer();

            await sharp({
              create: {
                width: 1206,
                height: 2622,
                channels: 3,
                background: { r: 0, g: 0, b: 0 }
              }
            })
              .composite([{ input: logo, gravity: 'centre' }])
              .png()
              .toFile('startup-iphone17.png');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Commit generated startup image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startup-iphone17.png
          git diff --cached --quiet || git commit -m "Add native iPhone 17 PWA startup image"
          git push
